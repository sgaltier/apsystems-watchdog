# SPDX-License-Identifier: AGPL-3.0-or-later
services:
  apsystems-watchdog:
    build: .
    image: apsystems-watchdog:latest
    container_name: apsystems-watchdog

    # Redémarre automatiquement après un reboot du NAS ou une mise à jour DSM.
    restart: unless-stopped
    stdin_open: true
    tty: true

    env_file:
      - ./config.env

    environment:
      TZ: Europe/Paris
      PV_START_TIME: "07:00"
      PV_END_TIME: "22:00"
      PV_INTERVAL_MINUTES: "30"
      PV_STATE_FILE: /data/state.json
      PV_LOG_FILE: /data/apsystems_watchdog.log
      PV_TEST_ON_START: "1"     # passez à 0 une fois la configuration validée

    volumes:
      # Conserve l'état (anti-spam, "production nulle depuis...") entre les
      # redémarrages. Sans ce volume, chaque reboot du NAS reposterait une
      # alerte déjà envoyée.
      - pv-data:/data

    # Le conteneur ne fait que quelques requêtes HTTPS par heure : on le bride
    # pour qu'il ne puisse jamais gêner les autres services du NAS.
    mem_limit: 128m
    cpu_shares: 256

    # Pas de section « logging: » ici, volontairement.
    #
    # DSM utilise un pilote de journalisation maison, « db », et c'est cette
    # base que lit l'onglet « Journal » de Container Manager. Imposer
    # driver: json-file (le défaut de Docker en amont) fait écrire le conteneur
    # dans un fichier que l'interface DSM ne consulte pas : l'onglet reste
    # désespérément vide alors que la sortie standard est bien produite.
    # En laissant DSM choisir, le journal redevient lisible depuis l'interface.
    #
    # Sur un Docker standard (Linux, portage ailleurs), l'absence de cette
    # section retombe sur json-file sans rotation. Le conteneur écrit environ
    # 5 Ko par jour : cela reste négligeable, et le fichier de log applicatif
    # (PV_LOG_FILE) garde de toute façon l'historique complet.

volumes:
  pv-data:
